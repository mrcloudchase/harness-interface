name: Bug
description: Something that doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you ran, what you expected, what happened. Remove any key." }
    validations: { required: true }
  - type: textarea
    id: response
    attributes: { label: The response, description: "Its status, error and harness.stderr, if a response was involved; the install log if an install was." }
