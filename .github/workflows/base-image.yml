# The sandbox base image, rebuilt from the shipped Dockerfile weekly and on change, scanned, and
# published by digest. Point HG_BASE_IMAGE at the published reference to run it on your nodes.
name: base-image
on:
  schedule: [{cron: "17 4 * * 1"}]
  push:
    branches: [main]
    paths: [harnessgateway/runtimes/base.Dockerfile]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/mrcloudchase/harnessgateway-base
          docker build -f harnessgateway/runtimes/base.Dockerfile -t "$image:$(date +%Y%m%d)" -t "$image:latest" .
          docker push "$image:$(date +%Y%m%d)" && docker push "$image:latest"
      - uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ghcr.io/mrcloudchase/harnessgateway-base:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
