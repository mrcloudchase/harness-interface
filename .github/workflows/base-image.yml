# The sandbox base image, rebuilt from the shipped Dockerfile weekly and on change, scanned, and
# published by digest. Point HG_BASE_IMAGE at the published reference to run it on your nodes.
name: base-image
on:
  schedule: [{cron: "17 4 * * 1"}]
  push:
    branches: [main]
    paths: [harnessgateway/runtimes/base.Dockerfile, .github/workflows/base-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/mrcloudchase/harnessgatewayai-base
          docker buildx build --platform linux/amd64,linux/arm64 -f harnessgateway/runtimes/base.Dockerfile \
            -t "$image:$(date +%Y%m%d)" -t "$image:latest" --push .
      - uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ghcr.io/mrcloudchase/harnessgatewayai-base:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
