# Every pull request and every push to main: the suite on both backends (SQLite and a directory;
# Postgres and MinIO as services), the Docker tests against a real daemon (a sandbox's turn, and the
# platform image run as an operator runs it), the layer rule, lint, and the documentation site built strictly.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: hg, POSTGRES_PASSWORD: hg, POSTGRES_DB: hg}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HG_TEST_POSTGRES: postgresql://hg:hg@localhost:5432/hg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python }} --extra dev pytest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: docker pull -q python:3.12-alpine && docker pull -q python:3.12-slim
      - run: uv run --extra dev pytest -m docker
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check --select F,E9 --target-version py311 .
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx --from mkdocs-material mkdocs build --strict
