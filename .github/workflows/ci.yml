# Every pull request and every push to main: the whole suite (no Docker, keys or network) on the
# oldest Python we support and the newest; the Docker tests against a real daemon; and a check for
# unused code.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python }} --extra dev pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: docker pull -q python:3.12-alpine && docker pull -q python:3.12-slim   # the door's image and the tests'
      - run: uv run --extra dev pytest -m docker

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check --select F,E9 --target-version py311 .
