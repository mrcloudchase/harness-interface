# A release is a version bump merged to main. When pyproject.toml's version has no tag yet, this
# tests that commit, builds it, tags it vX.Y.Z and publishes a GitHub release with the built
# package and the version's notes from CHANGELOG.md. Nothing else creates tags.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      - name: Is this version released yet?
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Its notes
        if: steps.version.outputs.new == 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"; exit 1; }

      - name: Test
        if: steps.version.outputs.new == 'true'
        run: uv run --extra dev pytest

      - name: Build
        if: steps.version.outputs.new == 'true'
        run: uv build

      - name: Tag and publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --notes-file notes.md
