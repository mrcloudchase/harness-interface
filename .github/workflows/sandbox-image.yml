# The default sandbox's image, built once per Dockerfile and published to this repository's packages
# as ghcr.io/<owner>/harness-interface/default:<hash>, the name the server gives it plus the
# registry. Anything that runs harnesses (Keeper's jobs, a new machine) pulls it instead of
# building it. A pull request that changes the Dockerfile builds it, to prove it builds; a merge to
# main publishes it; a manual run rebuilds it, fetching the vendor-installed CLIs' latest releases.
#
# The image holds the shipped harnesses' CLIs and nothing secret. The build has an empty context, no
# build arguments and no secret mounts, and the registry login comes only after it, so no credential
# is there to bake in. Provider keys reach a run only when it starts, by name (`docker run -e NAME`).
name: sandbox-image

on:
  push:
    branches: [main]
    paths: [harness_interface/resources/default.Dockerfile, .github/workflows/sandbox-image.yml]
  pull_request:
    paths: [harness_interface/resources/default.Dockerfile, .github/workflows/sandbox-image.yml]
  workflow_dispatch:

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - name: free disk space for the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: its name, as the server names it
        id: name
        run: |
          tag=$(python3 -c 'from harness_interface.resources import DEFAULT_SANDBOX; print(DEFAULT_SANDBOX.tag)')
          echo "local=$tag" >> "$GITHUB_OUTPUT"
          echo "remote=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$tag" >> "$GITHUB_OUTPUT"

      - name: build, as the server does, with nothing secret in reach
        env:
          LOCAL: ${{ steps.name.outputs.local }}
        run: |
          docker build -t "$LOCAL" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -f - "$(mktemp -d)" < harness_interface/resources/default.Dockerfile

      - name: check it holds no credential and its CLIs run
        env:
          LOCAL: ${{ steps.name.outputs.local }}
        run: |
          if docker image inspect --format '{{join .Config.Env "\n"}}' "$LOCAL" | grep -E '^[^=]*(KEY|TOKEN|SECRET|PASSWORD)='; then
            echo "the image's environment holds a credential"; exit 1
          fi
          docker run --rm --network none "$LOCAL" sh -c 'claude --version && codex --version && id -u'

      - name: publish
        if: github.event_name != 'pull_request'
        env:
          LOCAL: ${{ steps.name.outputs.local }}
          REMOTE: ${{ steps.name.outputs.remote }}
          TOKEN: ${{ github.token }}
        run: |
          trap 'docker logout ghcr.io' EXIT
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL" "$REMOTE"
          docker push -q "$REMOTE"
          echo "published $REMOTE" >> "$GITHUB_STEP_SUMMARY"
