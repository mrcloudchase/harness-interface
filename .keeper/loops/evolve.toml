name = "evolve"
goal = """Improve how Keeper works on this project. The status issue and the loops' end states show
where loops stall, give up or cost the most. Change the loop documents in .keeper/loops/ or the
prompts in .keeper/prompts/ so tasks are accepted more often for less, and nothing else."""
verifiers = [
  { kind = "rule", rules = ["keeper_paths"] },
  { kind = "command", run = "python -m pytest -q .keeper/tests" },
  { kind = "command", run = "python .keeper/engine/main.py replay" },
  { kind = "judge", roles = ["principles"] },
]
