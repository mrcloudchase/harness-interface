<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness-interface</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ee; --dim:#9aa3b2; --accent:#5dd39e; --warn:#f0b35c; --bad:#f06c6c; font-family: ui-sans-serif, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); }
  header b { font-size:16px; } header .who { color:var(--dim); margin-left:auto; font-size:13px; }
  nav { display:flex; gap:4px; padding:8px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; color:var(--dim); padding:6px 10px; border-radius:6px; cursor:pointer; }
  nav button.on { color:var(--fg); border-color:var(--line); background:var(--panel); }
  main { padding:20px; max-width:1100px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  h2 { font-size:15px; margin:0 0 10px; } h3 { font-size:13px; color:var(--dim); margin:12px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--dim); font-weight:500; }
  input, select, textarea { background:#0b0d11; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  textarea { width:100%; min-height:70px; font-family: ui-monospace, monospace; }
  button.act { background:var(--accent); color:#06281a; border:none; border-radius:6px; padding:7px 12px; cursor:pointer; font-weight:600; }
  button.quiet { background:none; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:5px 9px; cursor:pointer; }
  button.danger { color:var(--bad); border-color:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  pre { background:#0b0d11; border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; max-height:360px; font-size:12px; white-space:pre-wrap; }
  .secret { font-family:ui-monospace, monospace; background:#1e2a22; border:1px solid var(--accent); padding:8px; border-radius:6px; word-break:break-all; }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; border:1px solid var(--line); color:var(--dim); }
  .tag.ok { color:var(--accent); border-color:var(--accent); } .tag.bad { color:var(--bad); border-color:var(--bad); } .tag.run { color:var(--warn); border-color:var(--warn); }
  .err { color:var(--bad); font-size:13px; } .dim { color:var(--dim); font-size:13px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header><b>harness-interface</b><span class="dim" id="edition"></span><span class="who" id="who"></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const $ = (s) => document.querySelector(s);
const state = { key: sessionStorage.getItem("hi.key") || "", kind: "", me: null, tab: "", health: null };

async function api(method, path, body, raw) {

  let payload = body;
  if (body && !(body instanceof Blob) && !(body instanceof FormData)) { headers["content-type"] = "application/json"; payload = JSON.stringify(body); }
  const r = await fetch(path, { method, headers, body: payload });

  let data; try { data = JSON.parse(text); } catch { data = { detail: text }; }
  if (!r.ok) throw new Error(data.detail ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : r.status);

}
const fail = (e) => h("div", { class: "err" }, String(e.message || e));
const tag = (text, cls = "") => h("span", { class: "tag " + cls }, text);
const when = (t) => t ? new Date(t * 1000).toLocaleString() : "";

async function boot() {
  state.health = await (await fetch("/healthz")).json();
  $("#edition").textContent = state.health.signup === "open" ? "cloud" : "self-hosted";
  if (!state.key) return login();
  try {
    if (state.key.startsWith("hd_")) { await api("GET", "/v1/fleet"); state.kind = "deployer"; state.me = { name: "deployer" }; }
    else { state.me = await api("GET", "/v1/me"); state.kind = state.me.role; }
  } catch (e) { sessionStorage.removeItem("hi.key"); state.key = ""; return login(fail(e)); }
  $("#who").textContent = state.kind === "deployer" ? "deployer" : `${state.me.name} · ${state.me.tenant} · ${state.me.role}`;
  render();
}

function login(err) {
  $("#nav").replaceChildren();

  const form = h("div", { class: "card" }, h("h2", {}, "Sign in"), err || "",

      h("div", { class: "row" }, t, o, h("button", { class: "act", on: { click: async () => {
        try { const r = await api("POST", "/v1/signup", { tenant: t.value.trim(), owner: o.value.trim() });
          out.replaceChildren(h("p", {}, "Your owner key, shown once. Keep it:"), h("div", { class: "secret" }, r.key.secret),
            h("p", {}, h("button", { class: "act", on: { click: () => { state.key = r.key.secret; sessionStorage.setItem("hi.key", state.key); boot(); } } }, "Continue as " + r.owner)));
        } catch (e) { out.replaceChildren(fail(e)); } } } }, "Create")), out));
  }
  $("#main").replaceChildren(...parts);
}

const TABS = { owner: ["Overview", "Providers", "Harnesses", "Sessions", "Members"], member: ["Overview", "Providers", "Harnesses", "Sessions", "Members"], deployer: ["Fleet", "Tenants", "Workers"] };
function render() {
  const tabs = TABS[state.kind];
  state.tab = tabs.includes(state.tab) ? state.tab : tabs[0];
  $("#nav").replaceChildren(...tabs.map(t => h("button", { class: t === state.tab ? "on" : "", on: { click: () => { state.tab = t; render(); } } }, t)),
    h("button", { on: { click: () => { sessionStorage.removeItem("hi.key"); state.key = ""; login(); } } }, "Sign out"));
  ({ Overview: overview, Providers: providers, Harnesses: harnesses, Sessions: sessions, Members: members, Fleet: fleet, Tenants: tenants, Workers: workers })[state.tab]().then(el => $("#main").replaceChildren(el)).catch(e => $("#main").replaceChildren(fail(e)));
}

async function overview() {
  const me = await api("GET", "/v1/me");
  const snippet = `curl -s ${location.origin}/v1/responses -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \\\n  -d '{"model": "<harness>", "input": "Create hello.txt containing hello, then say done."}'`;
  return h("div", {}, h("div", { class: "card" }, h("h2", {}, `Tenant ${me.tenant}`), h("div", { class: "dim" }, `You are ${me.name} (${me.role}). Tenant status: ${me.tenant_status}.`),
      h("h3", {}, "Ceilings set by the deployer"), h("pre", {}, JSON.stringify(me.limits, null, 1))),
    h("div", { class: "card" }, h("h2", {}, "First request"), h("div", { class: "dim" }, "Add a provider, fork a package from the catalog, then:"), h("pre", {}, snippet),
      h("div", { class: "dim" }, "Any OpenAI Responses client works; model is the harness name or harness/provider/model.")));
}

async function providers() {
  const list = (await api("GET", "/v1/providers")).data;
  const name = h("input", { placeholder: "name" }), url = h("input", { placeholder: "https://api.deepseek.com/anthropic", size: "34" }),
    apiSel = h("select", {}, ...["anthropic-messages", "openai-chat", "openai-responses", "none"].map(a => h("option", {}, a))), key = h("input", { placeholder: "key (sealed on arrival)", type: "password", size: "30" }), out = h("div");
  const rows = list.map(p => h("tr", {}, h("td", {}, p.name), h("td", {}, p.url), h("td", {}, p.api), h("td", {}, state.kind === "owner" ? h("button", { class: "quiet danger", on: { click: async () => { await api("DELETE", "/v1/providers/" + p.name); render(); } } }, "remove") : "")));

      h("table", {}, h("tr", {}, h("th", {}, "name"), h("th", {}, "url"), h("th", {}, "api"), h("th")), ...rows)),
    state.kind === "owner" ? h("div", { class: "card" }, h("h2", {}, "+ Provider"), h("div", { class: "row" }, name, url, apiSel, key,
      h("button", { class: "act", on: { click: async () => { try { await api("PUT", "/v1/providers/" + name.value.trim(), { url: url.value.trim(), api: apiSel.value, key: key.value }); render(); } catch (e) { out.replaceChildren(fail(e)); } } } }, "Add")), out) : "");
}

async function harnesses() {

    state.kind === "owner" ? h("div", { class: "card" }, h("h2", {}, "+ Harness from the catalog"), h("div", { class: "row" }, pick, into,
      h("button", { class: "act", on: { click: async () => { try { await api("PUT", "/v1/harnesses/" + (into.value.trim() || pick.value), { catalog: pick.value }); render(); } catch (e) { out.replaceChildren(fail(e)); } } } }, "Fork")), out,
      h("h3", {}, "or upload a package archive"), h("div", { class: "row" }, upName, file, h("button", { class: "act", on: { click: async () => {
        try { const r = await api("PUT", "/v1/harnesses/" + upName.value.trim(), file.files[0], true); if (!r.ok) throw new Error((await r.json()).detail); render(); } catch (e) { out2.replaceChildren(fail(e)); } } } }, "Upload")), out2) : "",

}

async function sessions() {
  const list = (await api("GET", "/v1/sessions")).data.reverse();
  const hs = (await api("GET", "/v1/harnesses")).data;
  const model = h("input", { placeholder: "harness or harness/provider/model", list: "hs", size: "36" }), input = h("textarea", { placeholder: "the task" }), prev = h("input", { placeholder: "previous_response_id (optional)", size: "40" }), out = h("div");
  const dl = h("datalist", { id: "hs" }, ...hs.map(x => h("option", { value: x.name })));

    const r = await api("POST", "/v1/responses", { model: model.value.trim(), input: input.value, stream: true, ...(prev.value.trim() ? { previous_response_id: prev.value.trim() } : {}) }, true);
    if (!r.ok) return out.replaceChildren(fail(new Error((await r.json()).detail)));

        if (d.type === "response.output_text.delta") $("#live").textContent += d.delta; if (d.type.startsWith("response.") && d.response && !["response.created", "response.in_progress"].includes(d.type)) final = d.response; } }
    if (final) out.append(h("h3", {}, `response · ${final.status}`), h("pre", {}, final.output[0].content[0].text), h("div", { class: "dim" }, `response ${final.id} · session ${final.metadata.session_id}`));
    render();
  };
  const rows = list.map(s => h("tr", {}, h("td", {}, h("a", { href: "#", on: { click: (e) => { e.preventDefault(); session(s.id); } } }, s.id.slice(0, 18) + "…")), h("td", {}, s.harness), h("td", {}, s.member), h("td", {}, tag(s.status, s.status === "running" ? "run" : "")), h("td", {}, s.responses.length), h("td", {}, when(s.created_at))));
  return h("div", {}, dl, h("div", { class: "card" }, h("h2", {}, "New request"), h("div", { class: "row" }, model, prev), input, h("div", { class: "row" }, h("button", { class: "act", on: { click: run } }, "Run")), out),

}

async function session(sid) {
  const s = await api("GET", "/v1/sessions/" + sid);
  const turns = await Promise.all(s.responses.map(rid => api("GET", `/v1/responses/${rid}?detail=true`)));
  const steer = h("input", { placeholder: "steer the running turn", size: "40" }), out = h("div");
  const blocks = turns.map(t => h("div", { class: "card" }, h("div", { class: "row" }, h("b", {}, `turn ${t.metadata.turn}`), tag(t.status, t.status === "completed" ? "ok" : t.status === "in_progress" ? "run" : "bad"), h("span", { class: "dim" }, t.id), h("span", { class: "dim" }, t.model),
      t.status === "in_progress" ? h("button", { class: "quiet danger", on: { click: async () => { await api("POST", `/v1/responses/${t.id}/cancel`); session(sid); } } }, "cancel") : ""),
    h("h3", {}, "response"), h("pre", {}, t.output[0].content[0].text || "(empty)"), h("h3", {}, "request.sh stdout"), h("pre", {}, t.stdout || "(empty)"), t.stderr ? [h("h3", {}, "stderr"), h("pre", {}, t.stderr)] : "", t.error ? h("div", { class: "err" }, t.error.message) : ""));

      s.stored ? h("a", { href: `/v1/sessions/${sid}/archive`, on: { click: async (e) => { e.preventDefault(); const r = await api("GET", `/v1/sessions/${sid}/archive`, null, true); const u = URL.createObjectURL(await r.blob()); const a = h("a", { href: u, download: `${sid}.tar.gz` }); a.click(); } } }, "download workspace") : h("span", { class: "dim" }, "stateless"),
      s.status !== "running" ? h("button", { class: "quiet danger", on: { click: async () => { await api("DELETE", `/v1/sessions/${sid}`); render(); } } }, "delete") : ""),
    s.status === "running" ? h("div", { class: "row" }, steer, h("button", { class: "act", on: { click: async () => { try { await api("POST", `/v1/sessions/${sid}/interrupt`, { input: steer.value }); out.replaceChildren(h("div", { class: "dim" }, "steer delivered")); } catch (e) { out.replaceChildren(fail(e)); } } } }, "Steer"), out) : ""),
    ...blocks, h("div", { class: "card" }, h("h2", {}, "Trace"), h("pre", {}, trace.data.map(t => `${when(t.at)}  ${t.kind.padEnd(9)} ${t.response}${t.kind === "request" || t.kind === "interrupt" ? "  " + JSON.stringify(t.body.input).slice(0, 120) : ""}`).join("\n"))));

  const keyFor = h("input", { placeholder: "member", value: state.me.name }), label = h("input", { placeholder: "label (laptop, ci…)" }), out2 = h("div");
  return h("div", {}, state.kind === "owner" ? h("div", { class: "card" }, h("h2", {}, "Members"), h("table", {}, h("tr", {}, h("th", {}, "name"), h("th", {}, "role"), h("th", {}, "since")), ...ms.data.map(m => h("tr", {}, h("td", {}, m.name), h("td", {}, m.role), h("td", {}, when(m.created))))),
      h("h3", {}, "+ member"), h("div", { class: "row" }, name, role, h("button", { class: "act", on: { click: async () => { try { await api("POST", "/v1/members", { name: name.value.trim(), role: role.value }); render(); } catch (e) { out.replaceChildren(fail(e)); } } } }, "Add")), out) : "",
    h("div", { class: "card" }, h("h2", {}, "API keys"), h("table", {}, h("tr", {}, h("th", {}, "id"), h("th", {}, "member"), h("th", {}, "label"), h("th", {}, "created"), h("th")),
      ...ks.data.map(k => h("tr", {}, h("td", {}, k.id), h("td", {}, k.member), h("td", {}, k.label), h("td", {}, when(k.created)), h("td", {}, k.revoked ? tag("revoked", "bad") : h("button", { class: "quiet danger", on: { click: async () => { await api("DELETE", "/v1/keys/" + k.id); render(); } } }, "revoke"))))),
      h("h3", {}, "+ key"), h("div", { class: "row" }, keyFor, label, h("button", { class: "act", on: { click: async () => { try { const r = await api("POST", `/v1/members/${keyFor.value.trim()}/keys`, { label: label.value }); out2.replaceChildren(h("p", {}, "Shown once:"), h("div", { class: "secret" }, r.secret)); } catch (e) { out2.replaceChildren(fail(e)); } } } }, "Mint")), out2));

      h("button", { class: "quiet danger", on: { click: async () => { if (confirm(`Delete tenant ${t.name} and everything it owns?`)) { await api("DELETE", "/v1/tenants/" + t.name); render(); } } } }, "delete"))); });
  return h("div", {}, h("div", { class: "card" }, h("h2", {}, "Tenants"), h("table", {}, h("tr", {}, h("th", {}, "tenant"), h("th", {}, "status"), h("th", {}, "usage"), h("th", {}, "ceilings"), h("th")), ...rows)),
    h("div", { class: "card" }, h("h2", {}, "+ Tenant"), h("div", { class: "row" }, name, owner, limits, h("button", { class: "act", on: { click: async () => {
      try { const r = await api("POST", "/v1/tenants", { name: name.value.trim(), owner: owner.value.trim(), ...(limits.value.trim() ? { limits: JSON.parse(limits.value) } : {}) });
        out.replaceChildren(h("p", {}, `Owner key for ${r.owner}, shown once. Hand it over securely:`), h("div", { class: "secret" }, r.key.secret)); render; } catch (e) { out.replaceChildren(fail(e)); } } } }, "Create")), out));

async function workers() {
  const list = (await api("GET", "/v1/workers")).data;
  return h("div", { class: "card" }, h("h2", {}, "Workers"), h("table", {}, h("tr", {}, h("th", {}, "name"), h("th", {}, "id"), h("th", {}, "alive"), h("th", {}, "slots"), h("th", {}, "running"), h("th", {}, "version"), h("th", {}, "last seen"), h("th")),
    ...list.map(w => h("tr", {}, h("td", {}, w.name), h("td", {}, w.id), h("td", {}, tag(w.alive ? "alive" : "lost", w.alive ? "ok" : "bad")), h("td", {}, w.slots), h("td", {}, w.running), h("td", {}, w.version), h("td", {}, when(w.last_seen)),
      h("td", {}, h("button", { class: "quiet danger", on: { click: async () => { await api("DELETE", "/v1/workers/" + w.id); render(); } } }, "forget"))))),
