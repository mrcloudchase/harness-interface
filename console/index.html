<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness-interface</title>
<style>
  /* Houston: Astros navy and orange, a sand accent, one dark theme. */
  :root { --navy:#041E42; --navy-2:#0A2A5E; --navy-3:#123670; --line:#1E3F7A; --line-2:#2A4F8F; --fg:#EEF3FB; --dim:#9FB4D6; --muted:#6F86AD;
          --orange:#EB6E1F; --orange-2:#F58A3C; --sand:#F4E9D2; --ok:#4CC38A; --warn:#F5B942; --bad:#F26B6B;
          --radius:12px; font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  * { box-sizing: border-box; }
  html { background: var(--navy); }
  body { margin:0; color:var(--fg); background: radial-gradient(1200px 600px at 10% -10%, #0E3A8A 0%, var(--navy) 55%); min-height:100vh; }
  header { display:flex; gap:14px; align-items:center; padding:14px 28px; border-bottom:1px solid var(--line); background: rgba(4,30,66,.72); backdrop-filter: blur(8px); position: sticky; top:0; z-index:5; }
  header img { width:34px; height:34px; border-radius:9px; object-fit:cover; background:var(--sand); }
  header b { font-size:17px; letter-spacing:-.01em; } header .edition { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--orange-2); border:1px solid var(--orange); border-radius:999px; padding:3px 9px; }
  header a.link { color:var(--dim); text-decoration:none; font-size:13px; } header a.link:hover { color:var(--fg); }
  header .who { color:var(--dim); margin-left:auto; font-size:13px; }
  nav { display:flex; gap:6px; padding:12px 28px 0; flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; color:var(--dim); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; font-weight:500; transition: all .15s; }
  nav button:hover { color:var(--fg); background:rgba(255,255,255,.04); }
  nav button.on { color:var(--navy); background:var(--sand); border-color:var(--sand); font-weight:600; }
  main { padding:22px 28px 60px; max-width:1180px; }
  .card { background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015)); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  h2 { font-size:16px; margin:0 0 12px; letter-spacing:-.01em; } h3 { font-size:11px; color:var(--orange-2); margin:16px 0 8px; text-transform:uppercase; letter-spacing:.12em; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td, th { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  tr:hover td { background: rgba(255,255,255,.025); }
  input, select, textarea { background:rgba(2,16,40,.75); color:var(--fg); border:1px solid var(--line-2); border-radius:9px; padding:9px 11px; font:inherit; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--orange); box-shadow: 0 0 0 3px rgba(235,110,31,.22); }
  textarea { width:100%; min-height:84px; font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; font-size:13px; }
  button.act { background:var(--orange); color:#fff; border:none; border-radius:9px; padding:9px 16px; cursor:pointer; font:inherit; font-weight:600; transition: background .15s, transform .05s; }
  button.act:hover { background:var(--orange-2); } button.act:active { transform: translateY(1px); }
  button.quiet { background:none; color:var(--dim); border:1px solid var(--line-2); border-radius:9px; padding:6px 11px; cursor:pointer; font:inherit; } button.quiet:hover { color:var(--fg); border-color:var(--dim); }
  button.danger { color:var(--bad); border-color:rgba(242,107,107,.5); } button.danger:hover { border-color:var(--bad); background:rgba(242,107,107,.08); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  pre { background:#02142F; border:1px solid var(--line); border-radius:9px; padding:12px 14px; overflow:auto; max-height:380px; font-size:12.5px; line-height:1.5; white-space:pre-wrap; font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  .secret { font-family: ui-monospace, Menlo, monospace; background: rgba(235,110,31,.12); border:1px solid var(--orange); color:var(--sand); padding:10px 12px; border-radius:9px; word-break:break-all; }
  .tag { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.02em; border:1px solid var(--line-2); color:var(--dim); }
  .tag.ok { color:var(--ok); border-color:rgba(76,195,138,.5); background:rgba(76,195,138,.08); } .tag.bad { color:var(--bad); border-color:rgba(242,107,107,.5); background:rgba(242,107,107,.08); } .tag.run { color:var(--warn); border-color:rgba(245,185,66,.5); background:rgba(245,185,66,.08); }
  .err { color:var(--bad); font-size:13px; } .dim { color:var(--dim); font-size:13px; } p { line-height:1.5; }
  a { color:var(--orange-2); } a:hover { color:var(--sand); }
  .hero { display:grid; grid-template-columns: 1.2fr 1fr; gap:16px; } @media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
  .stat { display:flex; flex-direction:column; gap:4px; padding:14px 16px; border:1px solid var(--line); border-radius:var(--radius); background:rgba(255,255,255,.02); }
  .stat b { font-size:24px; letter-spacing:-.02em; } .stat span { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.1em; }
  .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:16px; }
  .login { max-width:560px; margin: 8vh auto 0; } .login .brand { display:flex; align-items:center; gap:14px; margin-bottom:22px; } .login .brand img { width:64px; height:64px; border-radius:16px; background:var(--sand); }
  .login .brand b { font-size:22px; display:block; } .login .brand span { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<header><img src="/console/picky.png" alt=""><b>harness-interface</b><span class="edition" id="edition"></span><a class="link" href="/docs/">Docs</a><a class="link" href="/reference">API</a><span class="who" id="who"></span></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const $ = (s) => document.querySelector(s);
const state = { key: sessionStorage.getItem("hi.key") || "", kind: "", me: null, tab: "", health: null };
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn); else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v); } for (const k of kids.flat()) e.append(k instanceof Node ? k : document.createTextNode(k ?? "")); return e; };

async function api(method, path, body, raw) {
  const headers = { Authorization: "Bearer " + state.key };
  let payload = body;
  if (body && !(body instanceof Blob) && !(body instanceof FormData)) { headers["content-type"] = "application/json"; payload = JSON.stringify(body); }
  const r = await fetch(path, { method, headers, body: payload });
  if (raw) return r;
  const text = await r.text();
  let data; try { data = JSON.parse(text); } catch { data = { detail: text }; }
  if (!r.ok) throw new Error(data.detail ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : r.status);
  return data;
}
const fail = (e) => h("div", { class: "err" }, String(e.message || e));
const tag = (text, cls = "") => h("span", { class: "tag " + cls }, text);
const when = (t) => t ? new Date(t * 1000).toLocaleString() : "";

async function boot() {
  state.health = await (await fetch("/healthz")).json();
  $("#edition").textContent = state.health.signup === "open" ? "cloud" : "self-hosted";
  if (!state.key) return login();
  try {
    if (state.key.startsWith("hd_")) { await api("GET", "/v1/fleet"); state.kind = "deployer"; state.me = { name: "deployer" }; }
    else { state.me = await api("GET", "/v1/me"); state.kind = state.me.role; }
  } catch (e) { sessionStorage.removeItem("hi.key"); state.key = ""; return login(fail(e)); }
  $("#who").textContent = state.kind === "deployer" ? "deployer" : `${state.me.name} · ${state.me.tenant} · ${state.me.role}`;
  render();
}

function login(err) {
  $("#nav").replaceChildren();
  $("#who").replaceChildren();
  const keyIn = h("input", { placeholder: "paste an API key (hi_… or the deployer key hd_…)", size: "52" });
  const brand = h("div", { class: "brand" }, h("img", { src: "/console/picky.png", alt: "" }), h("div", {}, h("b", {}, "harness-interface"), h("span", {}, "Coding agents, sandboxed, behind the OpenAI Responses API.")));
  const form = h("div", { class: "card" }, h("h2", {}, "Sign in"), err || "",
    h("div", { class: "row" }, keyIn, h("button", { class: "act", on: { click: () => { state.key = keyIn.value.trim(); sessionStorage.setItem("hi.key", state.key); boot(); } } }, "Sign in")),
    h("div", { class: "dim" }, "A member's key reaches their tenant; the deployer's key reaches the fleet."));
  const parts = [brand, form];
  if (state.health.signup === "open") {
    const t = h("input", { placeholder: "tenant name (lowercase)" }), o = h("input", { placeholder: "your member name" }), out = h("div");
    parts.push(h("div", { class: "card" }, h("h2", {}, "Create a tenant"),
      h("div", { class: "row" }, t, o, h("button", { class: "act", on: { click: async () => {
        try { const r = await api("POST", "/v1/signup", { tenant: t.value.trim(), owner: o.value.trim() });
          out.replaceChildren(h("p", {}, "Your owner key, shown once. Keep it:"), h("div", { class: "secret" }, r.key.secret),
            h("p", {}, h("button", { class: "act", on: { click: () => { state.key = r.key.secret; sessionStorage.setItem("hi.key", state.key); boot(); } } }, "Continue as " + r.owner)));
        } catch (e) { out.replaceChildren(fail(e)); } } } }, "Create")), out));
  }
  $("#main").replaceChildren(h("div", { class: "login" }, ...parts));
}

const TABS = { owner: ["Overview", "Providers", "Harnesses", "Sessions", "Members"], member: ["Overview", "Providers", "Harnesses", "Sessions", "Members"], deployer: ["Fleet", "Tenants", "Workers"] };
function render() {
  const tabs = TABS[state.kind];
  state.tab = tabs.includes(state.tab) ? state.tab : tabs[0];
  $("#nav").replaceChildren(...tabs.map(t => h("button", { class: t === state.tab ? "on" : "", on: { click: () => { state.tab = t; render(); } } }, t)),
    h("button", { on: { click: () => { sessionStorage.removeItem("hi.key"); state.key = ""; login(); } } }, "Sign out"));
  ({ Overview: overview, Providers: providers, Harnesses: harnesses, Sessions: sessions, Members: members, Fleet: fleet, Tenants: tenants, Workers: workers })[state.tab]().then(el => $("#main").replaceChildren(el)).catch(e => $("#main").replaceChildren(fail(e)));
}

async function overview() {
  const [me, ps, hs, ss] = await Promise.all([api("GET", "/v1/me"), api("GET", "/v1/providers"), api("GET", "/v1/harnesses"), api("GET", "/v1/sessions")]);
  const snippet = `curl -s ${location.origin}/v1/responses -H "Authorization: Bearer $KEY" -H 'content-type: application/json' \\\n  -d '{"model": "<harness>", "input": "Create hello.txt containing hello, then say done."}'`;
  const stat = (n, label) => h("div", { class: "stat" }, h("b", {}, String(n)), h("span", {}, label));
  const limits = Object.entries(me.limits).map(([k, v]) => h("tr", {}, h("td", {}, k), h("td", {}, String(v))));
  return h("div", {}, h("div", { class: "stats" }, stat(ps.data.length, "providers"), stat(hs.data.length, "harnesses"), stat(ss.data.length, "sessions"), stat(ss.data.filter(s => s.status === "running").length, "running")),
    h("div", { class: "hero" },
      h("div", { class: "card" }, h("h2", {}, `Tenant ${me.tenant}`), h("div", { class: "dim" }, `You are ${me.name} (${me.role}). Tenant status: ${me.tenant_status}.`),
        h("h3", {}, "Ceilings set by the deployer"), h("table", {}, ...limits)),
      h("div", { class: "card" }, h("h2", {}, "First request"), h("div", { class: "dim" }, "Add a provider, fork a package from the catalog, then:"), h("pre", {}, snippet),
        h("div", { class: "dim" }, "Any OpenAI Responses client works; model is the harness name or harness/provider/model."))));
}

async function providers() {
  const list = (await api("GET", "/v1/providers")).data;
  const name = h("input", { placeholder: "name" }), url = h("input", { placeholder: "https://api.deepseek.com/anthropic", size: "34" }),
    apiSel = h("select", {}, ...["anthropic-messages", "openai-chat", "openai-responses", "none"].map(a => h("option", {}, a))), key = h("input", { placeholder: "key (sealed on arrival)", type: "password", size: "30" }), out = h("div");
  const rows = list.map(p => h("tr", {}, h("td", {}, p.name), h("td", {}, p.url), h("td", {}, p.api), h("td", {}, state.kind === "owner" ? h("button", { class: "quiet danger", on: { click: async () => { await api("DELETE", "/v1/providers/" + p.name); render(); } } }, "remove") : "")));
  return h("div", {}, h("div", { class: "card" }, h("h2", {}, "Providers"), h("div", { class: "dim" }, "A model endpoint and its key. The key never enters a sandbox; the gateway swaps a per-turn token for it."),
      h("table", {}, h("tr", {}, h("th", {}, "name"), h("th", {}, "url"), h("th", {}, "api"), h("th")), ...rows)),
    state.kind === "owner" ? h("div", { class: "card" }, h("h2", {}, "+ Provider"), h("div", { class: "row" }, name, url, apiSel, key,
      h("button", { class: "act", on: { click: async () => { try { await api("PUT", "/v1/providers/" + name.value.trim(), { url: url.value.trim(), api: apiSel.value, key: key.value }); render(); } catch (e) { out.replaceChildren(fail(e)); } } } }, "Add")), out) : "");
}

async function harnesses() {
  const [list, catalog] = await Promise.all([api("GET", "/v1/harnesses"), api("GET", "/v1/catalog")]);
  const rows = list.data.map(hn => h("tr", {}, h("td", {}, h("b", {}, hn.name)), h("td", {}, hn.description), h("td", {}, `${hn.defaults.provider || "—"} / ${hn.defaults.model || "—"}`),
    h("td", {}, h("span", { class: "tag" }, hn.version), " ", h("span", { class: "dim" }, `${hn.versions.length} version${hn.versions.length > 1 ? "s" : ""}`)),
    h("td", {}, state.kind === "owner" ? h("button", { class: "quiet danger", on: { click: async () => { await api("DELETE", "/v1/harnesses/" + hn.name); render(); } } }, "remove") : "")));
  const pick = h("select", {}, ...catalog.data.map(c => h("option", { value: c.name }, `${c.name} — ${c.description.slice(0, 70)}`))), into = h("input", { placeholder: "name in your tenant" }), out = h("div");
  const file = h("input", { type: "file", accept: ".tgz,.tar.gz,.tar" }), upName = h("input", { placeholder: "name" }), out2 = h("div");
  const cat = h("table", {}, h("tr", {}, h("th", {}, "package"), h("th", {}, "verified"), h("th", {}, "provider shape"), h("th", {}, "note")),
    ...catalog.data.map(c => h("tr", {}, h("td", {}, c.name), h("td", {}, c.verified.passed !== undefined ? tag(`${c.verified.passed}/9 checks`, c.verified.passed === 9 ? "ok" : "") : tag("template")), h("td", {}, c.provider_env.key || "—"), h("td", { class: "dim" }, c.notes?.[0] || ""))));
  return h("div", {}, h("div", { class: "card" }, h("h2", {}, "Harnesses"), h("div", { class: "dim" }, "Your packages: install.sh, request.sh, response.sh and seeds. Request with model = the name."),
      h("table", {}, h("tr", {}, h("th", {}, "name"), h("th", {}, "description"), h("th", {}, "defaults"), h("th", {}, "version"), h("th")), ...rows)),
    state.kind === "owner" ? h("div", { class: "card" }, h("h2", {}, "+ Harness from the catalog"), h("div", { class: "row" }, pick, into,
      h("button", { class: "act", on: { click: async () => { try { await api("PUT", "/v1/harnesses/" + (into.value.trim() || pick.value), { catalog: pick.value }); render(); } catch (e) { out.replaceChildren(fail(e)); } } } }, "Fork")), out,
      h("h3", {}, "or upload a package archive"), h("div", { class: "row" }, upName, file, h("button", { class: "act", on: { click: async () => {
        try { const r = await api("PUT", "/v1/harnesses/" + upName.value.trim(), file.files[0], true); if (!r.ok) throw new Error((await r.json()).detail); render(); } catch (e) { out2.replaceChildren(fail(e)); } } } }, "Upload")), out2) : "",
    h("div", { class: "card" }, h("h2", {}, "Catalog"), cat));
}

async function sessions() {
  const hs = (await api("GET", "/v1/harnesses")).data;
  const model = h("input", { placeholder: "harness or harness/provider/model", list: "hs", size: "36" }), input = h("textarea", { placeholder: "the task" }), prev = h("input", { placeholder: "previous_response_id (optional)", size: "40" }), out = h("div");
  const dl = h("datalist", { id: "hs" }, ...hs.map(x => h("option", { value: x.name })));
  const run = async () => {
    out.replaceChildren(h("div", { class: "dim" }, "running…"), h("pre", { id: "live" }));
    const r = await api("POST", "/v1/responses", { model: model.value.trim(), input: input.value, stream: true, ...(prev.value.trim() ? { previous_response_id: prev.value.trim() } : {}) }, true);
    if (!r.ok) return out.replaceChildren(fail(new Error((await r.json()).detail)));
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", final = null;
    while (true) { const { value, done } = await reader.read(); if (done) break; buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) { const ev = buf.slice(0, i); buf = buf.slice(i + 2); const line = ev.split("\n").find(l => l.startsWith("data: ")); if (!line) continue; const d = JSON.parse(line.slice(6));
        if (d.type === "response.output_text.delta") $("#live").textContent += d.delta; if (d.type.startsWith("response.") && d.response && !["response.created", "response.in_progress"].includes(d.type)) final = d.response; } }
    if (final) out.append(h("h3", {}, `response · ${final.status}`), h("pre", {}, final.output[0].content[0].text), h("div", { class: "dim" }, `response ${final.id} · session ${final.metadata.session_id}`));
    table.replaceWith(table = await sessionTable());   // the list, refreshed in place; the response stays on screen
  };
  const sessionTable = async () => {
    const list = (await api("GET", "/v1/sessions")).data.reverse();
    const rows = list.map(s => h("tr", {}, h("td", {}, h("a", { href: "#", on: { click: (e) => { e.preventDefault(); session(s.id); } } }, s.id.slice(0, 18) + "…")), h("td", {}, s.harness), h("td", {}, s.member), h("td", {}, tag(s.status, s.status === "running" ? "run" : "")), h("td", {}, s.responses.length), h("td", {}, when(s.created_at))));
    return h("table", {}, h("tr", {}, h("th", {}, "session"), h("th", {}, "harness"), h("th", {}, "member"), h("th", {}, "status"), h("th", {}, "turns"), h("th", {}, "created")), ...rows);
  };
  let table = await sessionTable();
  return h("div", {}, dl, h("div", { class: "card" }, h("h2", {}, "New request"), h("div", { class: "row" }, model, prev), input, h("div", { class: "row" }, h("button", { class: "act", on: { click: run } }, "Run")), out),
    h("div", { class: "card" }, h("h2", {}, "Sessions"), table));
}

async function session(sid) {
  const s = await api("GET", "/v1/sessions/" + sid);
  const turns = await Promise.all(s.responses.map(rid => api("GET", `/v1/responses/${rid}?detail=true`)));
  const steer = h("input", { placeholder: "steer the running turn", size: "40" }), out = h("div");
  const blocks = turns.map(t => h("div", { class: "card" }, h("div", { class: "row" }, h("b", {}, `turn ${t.metadata.turn}`), tag(t.status, t.status === "completed" ? "ok" : t.status === "in_progress" ? "run" : "bad"), h("span", { class: "dim" }, t.id), h("span", { class: "dim" }, t.model),
      t.status === "in_progress" ? h("button", { class: "quiet danger", on: { click: async () => { await api("POST", `/v1/responses/${t.id}/cancel`); session(sid); } } }, "cancel") : ""),
    h("h3", {}, "response"), h("pre", {}, t.output[0].content[0].text || "(empty)"), h("h3", {}, "request.sh stdout"), h("pre", {}, t.stdout || "(empty)"), t.stderr ? [h("h3", {}, "stderr"), h("pre", {}, t.stderr)] : "", t.error ? h("div", { class: "err" }, t.error.message) : ""));
  const trace = await api("GET", `/v1/sessions/${sid}/trace`);
  $("#main").replaceChildren(h("div", { class: "card" }, h("div", { class: "row" }, h("button", { class: "quiet", on: { click: () => render() } }, "← sessions"), h("b", {}, sid), tag(s.status, s.status === "running" ? "run" : ""), h("span", { class: "dim" }, `${s.harness} · ${s.member} · version ${s.version}`),
      s.stored ? h("a", { href: `/v1/sessions/${sid}/archive`, on: { click: async (e) => { e.preventDefault(); const r = await api("GET", `/v1/sessions/${sid}/archive`, null, true); const u = URL.createObjectURL(await r.blob()); const a = h("a", { href: u, download: `${sid}.tar.gz` }); a.click(); } } }, "download workspace") : h("span", { class: "dim" }, "stateless"),
      s.status !== "running" ? h("button", { class: "quiet danger", on: { click: async () => { await api("DELETE", `/v1/sessions/${sid}`); render(); } } }, "delete") : ""),
    s.status === "running" ? h("div", { class: "row" }, steer, h("button", { class: "act", on: { click: async () => { try { await api("POST", `/v1/sessions/${sid}/interrupt`, { input: steer.value }); out.replaceChildren(h("div", { class: "dim" }, "steer delivered")); } catch (e) { out.replaceChildren(fail(e)); } } } }, "Steer"), out) : ""),
    ...blocks, h("div", { class: "card" }, h("h2", {}, "Trace"), h("pre", {}, trace.data.map(t => `${when(t.at)}  ${t.kind.padEnd(9)} ${t.response}${t.kind === "request" || t.kind === "interrupt" ? "  " + JSON.stringify(t.body.input).slice(0, 120) : ""}`).join("\n"))));
}

async function members() {
  const [ms, ks] = await Promise.all([api("GET", "/v1/members").catch(() => ({ data: [] })), api("GET", "/v1/keys")]);
  const name = h("input", { placeholder: "member name" }), role = h("select", {}, h("option", {}, "member"), h("option", {}, "owner")), out = h("div");
  const keyFor = h("input", { placeholder: "member", value: state.me.name }), label = h("input", { placeholder: "label (laptop, ci…)" }), out2 = h("div");
