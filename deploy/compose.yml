# One file, two profiles, the same image.
#
#   docker compose --profile one-box up -d       one box: every role in one container, SQLite and a
#                                                blob directory on the `hi-data` volume, Caddy for TLS
#   docker compose --profile ha up -d            many: api+gateway behind Caddy, workers that join,
#                                                Postgres and MinIO (or point HI_RECORDS / HI_BLOBS at
#                                                any Postgres and any S3)
#
# The data directory is mounted at the SAME path inside and out (/srv/hi/data), because a worker
# bind-mounts session trees into sandboxes by their host paths. Set HI_DOMAIN for Caddy's certificate.
name: harness-interface

x-env: &env
  HI_SIGNUP: ${HI_SIGNUP:-closed}
  HI_DEPLOYER_KEY: ${HI_DEPLOYER_KEY:-}
  HI_MASTER_KEY: ${HI_MASTER_KEY:-}
  HI_JOIN_TOKEN: ${HI_JOIN_TOKEN:-}
  HI_PUBLIC_URL: ${HI_PUBLIC_URL:-https://${HI_DOMAIN:-localhost}}
  HI_GATEWAY_URL: ${HI_GATEWAY_URL:-http://host.docker.internal:8081}
  HI_BASE_IMAGE: ${HI_BASE_IMAGE:-}
  HI_RUNTIME: ${HI_RUNTIME:-}
  HI_ALLOW_PRIVATE: ${HI_ALLOW_PRIVATE:-0}
  HI_DATA_DIR: /srv/hi/data

services:
  caddy:
    image: caddy:2.9.1
    profiles: [one-box, ha]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {HI_DOMAIN: "${HI_DOMAIN:-localhost}"}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # one box
  platform:
    image: ${HI_IMAGE:-ghcr.io/mrcloudchase/harness-interface:4.0.0}
    profiles: [one-box]
    restart: unless-stopped
    command: ["serve", "--role", "all"]
    environment:
      <<: *env
      HI_HOST: 0.0.0.0
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8081:8081"]              # the gateway, for the doors on this host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/hi/data:/srv/hi/data

  # many boxes
  api:
    image: ${HI_IMAGE:-ghcr.io/mrcloudchase/harness-interface:4.0.0}
    profiles: [ha]
    restart: unless-stopped
    command: ["serve", "--role", "api,gateway"]
    deploy: {replicas: 2}
    environment:
      <<: *env
      HI_HOST: 0.0.0.0
      HI_RECORDS: ${HI_RECORDS:-postgresql://hi:hi@postgres/hi}
      HI_BLOBS: ${HI_BLOBS:-s3://hi}
      HI_S3_ENDPOINT: ${HI_S3_ENDPOINT:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-hi}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-hi-secret-change-me}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on: [postgres, minio]

  worker:
    image: ${HI_IMAGE:-ghcr.io/mrcloudchase/harness-interface:4.0.0}
    profiles: [ha]
    restart: unless-stopped
    command: ["serve", "--role", "worker"]
    environment:
      <<: *env
      HI_CONTROL_URL: ${HI_CONTROL_URL:-http://api:8000}
      HI_GATEWAY_URL: ${HI_GATEWAY_URL:-http://host.docker.internal:8081}
      HI_WORKER_SLOTS: ${HI_WORKER_SLOTS:-4}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/hi/data:/srv/hi/data
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    profiles: [ha]
    restart: unless-stopped
    environment: {POSTGRES_USER: hi, POSTGRES_PASSWORD: hi, POSTGRES_DB: hi}
    volumes: [postgres-data:/var/lib/postgresql/data]

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    profiles: [ha]
    restart: unless-stopped
    command: server /data
    environment: {MINIO_ROOT_USER: hi, MINIO_ROOT_PASSWORD: hi-secret-change-me}
    volumes: [minio-data:/data]

volumes:
  caddy-data: {}
  caddy-config: {}
  postgres-data: {}
  minio-data: {}
