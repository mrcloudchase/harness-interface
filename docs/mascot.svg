<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" role="img" aria-label="A cute hermit crab carrying a spiral shell, the harness-interface mascot">
  <!-- ground shadow -->
  <ellipse cx="185" cy="250" rx="125" ry="13" fill="#1b2430" opacity=".10"/>

  <!-- shell -->
  <g transform="translate(228 150) rotate(-12)">
    <circle r="84" fill="#F4B266"/>
    <circle r="84" fill="none" stroke="#D98B3C" stroke-width="6"/>
    <path d="M-66 0a66 66 0 0 1 132 0a50 50 0 0 1-100 0a36 36 0 0 1 72 0a23 23 0 0 1-46 0a12 12 0 0 1 24 0"
          fill="none" stroke="#D98B3C" stroke-width="9" stroke-linecap="round"/>
    <circle cx="6" cy="0" r="7" fill="#D98B3C"/>
    <!-- highlight -->
    <ellipse cx="-30" cy="-44" rx="16" ry="9" fill="#fff" opacity=".35" transform="rotate(-30 -30 -44)"/>
  </g>

  <!-- back legs, tucked under the shell -->
  <g fill="none" stroke="#E0533F" stroke-width="10" stroke-linecap="round">
    <path d="M150 198c-6 18-2 30 8 36"/>
    <path d="M170 204c0 16 6 26 16 30"/>
  </g>

  <!-- body -->
  <ellipse cx="118" cy="172" rx="66" ry="52" fill="#F26B5B"/>
  <ellipse cx="112" cy="188" rx="46" ry="28" fill="#FF8F7E"/>

  <!-- front legs -->
  <g fill="none" stroke="#E0533F" stroke-width="10" stroke-linecap="round">
    <path d="M92 212c-10 10-12 22-6 30"/>
    <path d="M118 218c-2 10 0 20 6 26"/>
  </g>

  <!-- claws -->
  <g fill="#F26B5B" stroke="#E0533F" stroke-width="5" stroke-linejoin="round">
    <path d="M58 182c-18-4-32 4-36 18 6 10 18 14 30 10l-4-10 10 2 6-8z"/>
    <path d="M152 206c14 4 24 14 22 26-10 6-22 4-30-4l8-8-10-4 4-10z"/>
  </g>

  <!-- eyestalks -->
  <g fill="none" stroke="#E0533F" stroke-width="8" stroke-linecap="round">
    <path d="M96 128c0-18 2-30 8-38"/>
    <path d="M136 128c0-18-2-30-8-38"/>
  </g>
  <!-- eyes -->
  <g>
    <circle cx="104" cy="82" r="19" fill="#fff" stroke="#E0533F" stroke-width="5"/>
    <circle cx="128" cy="82" r="19" fill="#fff" stroke="#E0533F" stroke-width="5"/>
    <circle cx="107" cy="85" r="9" fill="#1b2430"/>
    <circle cx="131" cy="85" r="9" fill="#1b2430"/>
    <circle cx="111" cy="81" r="3.5" fill="#fff"/>
    <circle cx="135" cy="81" r="3.5" fill="#fff"/>
  </g>

  <!-- cheeks and smile -->
  <circle cx="84" cy="170" r="8" fill="#FFB3A6" opacity=".9"/>
  <circle cx="150" cy="170" r="8" fill="#FFB3A6" opacity=".9"/>
  <path d="M106 164q12 12 24 0" fill="none" stroke="#9E2F22" stroke-width="4" stroke-linecap="round"/>

  <!-- a tiny prompt it is carrying -->
  <g transform="translate(22 142)">
    <rect x="0" y="0" width="52" height="30" rx="7" fill="#1b2430"/>
    <text x="10" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#7CE0C3">&gt;_</text>
  </g>
</svg>
