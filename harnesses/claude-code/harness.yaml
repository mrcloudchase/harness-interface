name: claude-code
description: >
  Claude Code, headless. Shell, files, web fetch. Speaks the Anthropic Messages API, so its
  provider is Anthropic or any endpoint that serves that shape (DeepSeek, OpenRouter, ...).
provider: anthropic
files:
  AGENTS.md: "{instructions}"
run:
  env:
    HOME: "{workspace}/.home"   # transcripts land inside the workspace, so --resume works later
    IS_SANDBOX: "1"             # claude refuses --dangerously-skip-permissions as root without this
  stdout: application/x-ndjson
  timeout_s: 900
