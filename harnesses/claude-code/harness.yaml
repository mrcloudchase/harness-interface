kind: Harness
name: claude-code
description: >
  Anthropic's Claude Code CLI, headless. A shell-driven coding agent: reads and edits files,
  runs commands and tests, and iterates until the task is done. Best for multi-file changes,
  debugging and anything that needs a terminal. Anthropic models only. Mid cost, mid latency.
labels: [coding, shell, files, tests]
models: [claude-sonnet-5-5, claude-opus-5-5, claude-haiku-5-5]
secrets: [ANTHROPIC_API_KEY]
files:
  AGENTS.md: "{request.instructions}"
run:
  argv: [bash, "{harness_dir}/run.sh"]
  env:
    HOME: "{workspace}/.home"   # transcripts land inside the workspace, so --resume works later
    IS_SANDBOX: "1"             # claude refuses --dangerously-skip-permissions as root without this
  stdout: application/x-ndjson
  timeout_s: 900
check: [claude, --version]
