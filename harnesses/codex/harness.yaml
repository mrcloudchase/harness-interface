kind: Harness
name: codex
description: >
  OpenAI's Codex CLI, headless, running GPT-family models. A general agent with a shell: it
  reads and writes files and runs commands in the workspace, and can fetch the web through the
  shell. Suited to coding and automation tasks and to document work that happens in files.
  Prefers to work through commands rather than conversation. Does not report cost, only
  tokens. Low to mid cost, mid latency.
labels: [general, shell, files, web, coding, writing]
models: [gpt-5.3-codex, gpt-5.2-codex]
secrets: [OPENAI_API_KEY]
files:
  AGENTS.md: "{request.instructions}"
run:
  argv: [bash, "{harness_dir}/run.sh"]
  env:
    HOME: "{workspace}/.home"
    CODEX_HOME: "{workspace}/.home/.codex"   # sessions live here, so `resume --last` is this session's
  stdout: application/x-ndjson
  timeout_s: 900
check: [codex, --version]
