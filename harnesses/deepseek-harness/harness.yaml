kind: Harness
name: deepseek-harness
description: >
  DeepSeek Harness (dsh), headless, running DeepSeek models. A general agent with read, edit
  and shell tools: it works in the workspace step by step and can reach the web through the
  shell. Suited to routine coding changes, questions about a codebase, and short writing or
  summarizing tasks. Cheapest of the three per token. Does not report cost, only tokens. Low
  cost, mid latency.
labels: [general, shell, files, web, coding, writing]
models: [deepseek-chat, deepseek-reasoner]
secrets: [DEEPSEEK_API_KEY]
files:
  AGENTS.md: "{request.instructions}"
run:
  argv: [bash, "{harness_dir}/run.sh"]
  env:
    HOME: "{workspace}/.home"   # dsh keeps profiles and sessions under $HOME/.dsh, so resume works later
    DSH_TELEMETRY_DISABLED: "1"
  stdout: application/x-ndjson
  timeout_s: 900
check: [dsh, --version]
