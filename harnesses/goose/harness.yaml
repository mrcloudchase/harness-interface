name: goose
description: >
  Goose (Block), headless. Shell, files, edit, subagents. Its anthropic provider reads
  ANTHROPIC_API_KEY and ANTHROPIC_HOST, so its provider is Anthropic or any endpoint that serves
  the Messages shape. Prints a short text banner (with the session id) before its JSON events.
provider: anthropic
files:
  AGENTS.md: "{instructions}"
run:
  env:
    HOME: "{workspace}/.home"   # sessions live in $HOME/.local/share/goose/sessions/sessions.db, so --resume works later
    GOOSE_MODE: auto            # approve tool calls without asking
  stdout: text/plain
  timeout_s: 900
