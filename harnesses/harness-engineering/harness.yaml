name: harness-engineering
description: >
  The harness from the harness-engineering course: Claude through the Anthropic SDK, one shell
  tool, compaction when context fills. harness.py travels with this folder. No session resume;
  a follow-up keeps the files only. Reports no usage.
provider: anthropic
run:
  env:
    HOME: "{workspace}/.home"
  stdout: text/plain
  timeout_s: 900
