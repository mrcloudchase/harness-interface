name: omp
description: >
  OMP (oh-my-pi), the pi coding agent fork, headless. Read, bash, edit, write tools. Its anthropic
  provider reads ANTHROPIC_API_KEY; a non-Anthropic base URL would need a models.json entry.
provider: anthropic
run:
  env:
    HOME: "{workspace}/.home"   # sessions and agent.db land under $HOME/.omp/agent, so --resume works later
  stdout: application/x-ndjson
  timeout_s: 900
