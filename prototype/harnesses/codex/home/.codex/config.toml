# Copied into $HOME/.codex before every response. The adapter adds model_providers.hi.base_url.
model_provider = "hi"
cli_auth_credentials_store = "ephemeral"   # the key from account/login/start stays in memory: no auth.json
check_for_update_on_startup = false

[model_providers.hi]
name = "hi"
wire_api = "responses"                      # the only wire API codex 0.163 has ("chat" is a config error)
requires_openai_auth = true                 # send the logged-in (ephemeral) key as Bearer

[features]
plugins = false                  # else: clones a 103 MB plugins repo from github.com at startup
api_key_model_discovery = false  # else: chatgpt.com model discovery
unbounded_connection_retries = false  # else: a dead provider is retried until the run times out

[analytics]
enabled = false                  # else: ab.chatgpt.com
