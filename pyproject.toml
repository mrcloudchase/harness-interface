[project]
name = "harness-interface"
dynamic = ["version"]                # the newest section of CHANGELOG.md
description = "A multi-tenant harness platform: tenants bring providers and harness packages; the platform runs them sandboxed behind the OpenAI Responses API."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["cryptography>=42", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27",
                "psycopg[binary]>=3.1", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "openai>=1.40", "moto[server]>=5"]   # the tests' clients and the S3 stand-in

[project.scripts]
harness-interface = "harness_interface.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "CHANGELOG.md"
pattern = '^## \[(?P<version>[^\]]+)\]'

[tool.hatch.build.targets.wheel]
packages = ["harness_interface"]

[tool.hatch.build.targets.wheel.force-include]
catalog = "harness_interface/catalog"
console = "harness_interface/console"
# The documentation site is built into harness_interface/docs by `mkdocs build` (see mkdocs.yml) and
# ships in the wheel from there; the API serves it at /docs.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = ["docker: needs a running Docker daemon"]
