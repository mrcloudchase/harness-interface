[project]
name = "harness-interface"
version = "1.0.0"
description = "One API in front of every harness, every run in a sandbox; and `hi`, its command line."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",                     # the CLI's HTTP client
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness-interface = "harness_interface.app:main"   # the API server
hi = "hi_cli.main:main"                            # the command line, a client of the API

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_interface", "frontend/cli/hi_cli"]

[tool.hatch.build.targets.wheel.force-include]
"harnesses" = "hi_cli/harnesses"                   # the shipped harnesses travel with the CLI

[tool.pytest.ini_options]
testpaths = ["tests"]
