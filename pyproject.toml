[project]
name = "harness-interface"
version = "1.0.0"
description = "Providers, sandboxes and harnesses as resources; call any harness through the Responses wire format; every run in a sandbox."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hi = "hi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
