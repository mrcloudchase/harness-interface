[project]
name = "harness-interface"
version = "0.1.0"
description = "Register harnesses as resources; route requests to them; pass the response through."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hi = "hi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
