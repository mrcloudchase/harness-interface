[project]
name = "harness-interface"
dynamic = ["version"]                # the newest section of CHANGELOG.md
description = "A multi-tenant harness server: orgs bring providers, sandboxes and harness folders; members drive them through the OpenAI Responses API."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["cryptography>=42", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "openai>=1.40", "httpx>=0.27"]   # the tests' clients, and scripts/live.py's

[project.scripts]
harness-interface = "harness_interface.__main__:main"   # init and serve

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "CHANGELOG.md"
pattern = '^## \[(?P<version>[^\]]+)\]'

[tool.hatch.build.targets.wheel]
packages = ["harness_interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = ["docker: needs a running Docker daemon"]
