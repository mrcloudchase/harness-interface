[project]
name = "harness-interface"
dynamic = ["version"]                # the newest section of CHANGELOG.md
description = "Run any coding harness in a locked-down sandbox: an execution library and an OpenAI Responses-compatible server."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []                    # the library is the standard library only

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
dev = ["harness-interface[server]", "pytest>=8", "openai>=1.40", "httpx>=0.27"]   # httpx: the API's test client

[project.scripts]
harness-interface = "harness_interface.api.app:main"   # the server

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "CHANGELOG.md"
pattern = '^## \[(?P<version>[^\]]+)\]'

[tool.hatch.build.targets.wheel]
packages = ["harness_interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
extend-exclude = ["prototype"]       # the evidence the plan rests on, kept as it ran; removed once ported
