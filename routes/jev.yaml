# The policy, authored in Jev's own question types (choice / noul / score): how `route` mode picks
# a harness, how every run is judged, how a fan-out contest is won.
# `criteria: from_registry` turns every registered harness into an option described by its record
# alone: runs, delivered, failed, contests, won, lost. Jev never sees the descriptions.
kind: Route
engine: jev
model: jev-latest
state:
  task: "{request.task}"
  instructions: "{request.instructions}"
  files: "{request.file_names}"
  model_requested: "{request.model}"
questions:
  harness:
    type: choice
    instructions: >
      Which harness should run this task? Each option is a harness's record: how often it
      delivered, and how often it won when every harness tried the same task.
    criteria: from_registry
  risky:
    type: noul
    instructions: >
      Could carrying out this task change or delete anything outside its own workspace, spend
      money, send messages, or otherwise act on the world (deploy, delete, send, pay)?
  size:
    type: score
    instructions: How much work is this task?
    criteria: [a quick answer or lookup, a short piece of work, a multi-step job, a whole project]
decide:
  - when: risky.probability > 0.8
    then: reject needs a person before an agent acts
  - when: harness.confidence >= 0.5
    then: use harness.choice
  - then: use default
default: claude-code

# Every run is judged on delivery: did the harness produce what was asked. Jev reads the task,
# the instructions, the harness's answer and the produced files. It cannot run code or verify
# facts; a person's verdict (PATCH /runs/{id}) replaces its label.
judge:
  model: jev-latest
  questions:
    completed:
      type: noul
      instructions: >
        Was the task completed? Judge delivery against what was asked: the requested file,
        answer or change exists, matches the instructions (length, format, scope), and the
        harness reports it finished without error. Do not guess at facts or run anything.
  success_when: completed.probability >= 0.5

# A fan-out contest is settled among the delivered outputs: one choice question, one option per
# harness, each option being what that harness produced. The winner takes the win; the rest lose.
arena:
  model: jev-latest
  instructions: >
    Which output best accomplishes the task? Judge the work itself: completeness against what
    was asked, correctness as far as it can be read, and fit to the instructions.
