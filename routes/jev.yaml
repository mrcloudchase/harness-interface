# The routing decision, authored in Jev's own question types (choice / noul / score).
# `criteria: from_registry` turns every registered harness into an option, described by its card.
kind: Route
engine: jev
model: jev-latest
state:
  task: "{request.task}"
  instructions: "{request.instructions}"
  files: "{request.file_names}"
  model_requested: "{request.model}"
questions:
  harness:
    type: choice
    instructions: Which registered harness should run this task?
    criteria: from_registry
  risky:
    type: noul
    instructions: Could this task change or delete anything outside its own workspace (deploy, delete, send, pay)?
  size:
    type: score
    instructions: How much work is this task?
    criteria: [a one-line change, one file, several files, a whole project]
decide:
  - when: risky.probability > 0.8
    then: reject needs a person before an agent acts
  - when: harness.confidence >= 0.6
    then: use harness.choice
  - then: use default
default: claude-code

# A run that carries no `check` is judged: Jev reads the task, the instructions, the harness's
# answer and the produced files. The verdict is the label the evidence sentence on each harness's
# card is built from, so routing improves from judged history.
judge:
  model: jev-latest
  questions:
    success:
      type: noul
      instructions: Did the output accomplish the task as asked, completely and correctly?
    quality:
      type: score
      instructions: How good is the output for this task?
      criteria: [unusable, partly done, done with flaws, done well]
  success_when: success.probability >= 0.7
