# A fake harness with no model: it echoes the task as NDJSON, writes one file, reports a session
# id and usage, and answers. Exists so the server can be tested end to end without a provider.
name: echo
description: Echoes the task. For tests.
provider: none
files:
  AGENTS.md: "{instructions}"
run:
  stdout: application/x-ndjson
  timeout_s: 30
