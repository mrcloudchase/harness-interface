<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">Picky</title>
  <desc id="d">Picky, the Harness Gateway mascot: a hermit crab with no shell of its own.</desc>
  <defs>
    <radialGradient id="body" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#FF9A4D"/>
      <stop offset="0.7" stop-color="#EB6E1F"/>
      <stop offset="1" stop-color="#C9561A"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#FFD9B8"/>
      <stop offset="1" stop-color="#F7B27A"/>
    </radialGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A4D"/>
      <stop offset="1" stop-color="#D2601E"/>
    </linearGradient>
  </defs>
  <!-- legs -->
  <g stroke="#C9561A" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M86 176 Q60 196 54 220"/><path d="M98 190 Q84 212 86 232"/>
    <path d="M170 176 Q196 196 202 220"/><path d="M158 190 Q172 212 170 232"/>
  </g>
  <g stroke="#EB6E1F" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M86 176 Q60 196 54 220"/><path d="M98 190 Q84 212 86 232"/>
    <path d="M170 176 Q196 196 202 220"/><path d="M158 190 Q172 212 170 232"/>
  </g>
  <!-- claws -->
  <g>
    <path d="M58 146 C30 140 18 118 30 100 C40 86 60 90 64 104 L72 100 C70 122 76 136 58 146 Z" fill="url(#claw)" stroke="#C9561A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M34 103 C36 94 50 92 56 100" fill="none" stroke="#C9561A" stroke-width="3" stroke-linecap="round"/>
    <path d="M198 146 C226 140 238 118 226 100 C216 86 196 90 192 104 L184 100 C186 122 180 136 198 146 Z" fill="url(#claw)" stroke="#C9561A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M222 103 C220 94 206 92 200 100" fill="none" stroke="#C9561A" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- body -->
  <ellipse cx="128" cy="150" rx="66" ry="52" fill="url(#body)" stroke="#C9561A" stroke-width="3"/>
  <ellipse cx="128" cy="166" rx="40" ry="24" fill="url(#belly)" opacity="0.9"/>
  <!-- eye stalks -->
  <g stroke="#EB6E1F" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M110 108 Q104 86 100 72"/><path d="M146 108 Q152 86 156 72"/>
  </g>
  <!-- eyes -->
  <g>
    <circle cx="100" cy="64" r="22" fill="#FFFFFF" stroke="#C9561A" stroke-width="3"/>
    <circle cx="156" cy="64" r="22" fill="#FFFFFF" stroke="#C9561A" stroke-width="3"/>
    <circle cx="104" cy="67" r="12" fill="#1B1B1B"/><circle cx="160" cy="67" r="12" fill="#1B1B1B"/>
    <circle cx="108" cy="62" r="4.5" fill="#FFFFFF"/><circle cx="164" cy="62" r="4.5" fill="#FFFFFF"/>
  </g>
  <!-- smile and blush -->
  <path d="M110 156 Q128 172 146 156" fill="none" stroke="#8E3A0E" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="92" cy="152" rx="9" ry="5" fill="#FF8A8A" opacity="0.55"/>
  <ellipse cx="164" cy="152" rx="9" ry="5" fill="#FF8A8A" opacity="0.55"/>
  <!-- antennae -->
  <g stroke="#C9561A" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M118 102 Q112 84 96 78"/><path d="M138 102 Q144 84 160 78"/>
  </g>
</svg>
